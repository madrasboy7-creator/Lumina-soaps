services:
  - type: web
    name: lumina-soaps
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OWNER_EMAIL
        value: niranjana@luminasoaps.com
      - key: OWNER_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        value: niranjana@luminasoaps.com
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
