<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background Circle -->
  <circle cx="250" cy="250" r="240" fill="#FAF7EF" stroke="#354F35" stroke-width="4.5" />
  <!-- Inner concentric circle -->
  <circle cx="250" cy="250" r="226" fill="none" stroke="#526E52" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Sunburst above L -->
  <g transform="translate(250, 148)">
    <!-- Sun Arch -->
    <path d="M -48 10 A 50 50 0 0 1 48 10" fill="none" stroke="#D39832" stroke-width="3" stroke-linecap="round" />
    <!-- Sun Rays -->
    <line x1="0" y1="-50" x2="0" y2="-68" stroke="#D39832" stroke-width="3" stroke-linecap="round" />
    <line x1="-24" y1="-44" x2="-35" y2="-59" stroke="#D39832" stroke-width="2.5" stroke-linecap="round" />
    <line x1="24" y1="-44" x2="35" y2="-59" stroke="#D39832" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-42" y1="-28" x2="-58" y2="-38" stroke="#D39832" stroke-width="2.5" stroke-linecap="round" />
    <line x1="42" y1="-28" x2="58" y2="-38" stroke="#D39832" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-54" y1="-8" x2="-72" y2="-12" stroke="#D39832" stroke-width="2.5" stroke-linecap="round" />
    <line x1="54" y1="-8" x2="72" y2="-12" stroke="#D39832" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Botanical Monogram L -->
  <g transform="translate(210, 130)">
    <!-- Monogram L Stem & Base -->
    <path d="M 20 10 C 20 5, 26 2, 42 2 L 42 16 C 36 16, 34 20, 34 28 L 34 112 C 34 122, 40 124, 52 124 C 70 124, 88 116, 98 94 C 99 92, 102 92, 103 94 C 103 98, 97 128, 40 128 C 18 128, 12 120, 12 108 L 12 28 C 12 20, 10 16, 4 16 L 4 2 C 16 2, 20 5, 20 10 Z" fill="#2E4A2E" />
    
    <!-- Leaves interwoven with L -->
    <!-- Center Left Leaf -->
    <path d="M 34 68 C 30 52, 42 40, 52 38 C 55 52, 46 66, 34 68 Z" fill="#4B6E44" />
    <path d="M 36 65 Q 44 54 50 40" stroke="#FAF7EF" stroke-width="1" fill="none" opacity="0.7" />
    
    <!-- Large Sprouting Right Leaf -->
    <path d="M 34 92 C 48 76, 80 50, 114 62 C 118 78, 88 106, 52 104 Z" fill="#3D5F37" />
    <!-- Leaf midrib -->
    <path d="M 40 92 Q 74 74 112 63" stroke="#FAF7EF" stroke-width="1.4" fill="none" opacity="0.6" />
    
    <!-- Small budding leaf -->
    <path d="M 34 82 C 40 76, 54 74, 58 82 C 54 88, 42 90, 34 82 Z" fill="#608455" />
  </g>

  <!-- LUMINA Title -->
  <text x="250" y="320" text-anchor="middle" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="62" font-weight="700" fill="#243E24" letter-spacing="7">LUMINA</text>

  <!-- Botanical Divider line with centered leaves -->
  <g transform="translate(250, 342)">
    <line x1="-130" y1="0" x2="-22" y2="0" stroke="#354F35" stroke-width="1.8" />
    <line x1="22" y1="0" x2="130" y2="0" stroke="#354F35" stroke-width="1.8" />
    <!-- Twin leaves -->
    <path d="M -2 0 C -8 -10, -18 -8, -18 0 C -12 2, -6 2, -2 0 Z" fill="#42603E" />
    <path d="M 2 0 C 8 -10, 18 -8, 18 0 C 12 2, 6 2, 2 0 Z" fill="#42603E" />
  </g>

  <!-- HOMEMADE SOAPS -->
  <text x="250" y="372" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="18.5" font-weight="700" fill="#2E4A2E" letter-spacing="7.5">HOMEMADE SOAPS</text>

  <!-- Pure Care • Natural Glow -->
  <text x="250" y="402" text-anchor="middle" font-family="'Cormorant Garamond', 'Georgia', serif" font-style="italic" font-size="20" font-weight="600" fill="#465E45" letter-spacing="1.5">Pure Care  •  Natural Glow</text>
</svg>
